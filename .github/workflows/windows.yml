name: Logiciel Windows (.exe)

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    name: Tests du cœur (lecture des broderies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p broderie-core

  windows:
    name: Installeur Windows
    needs: tests
    runs-on: windows-latest
    env:
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - run: npm install
      - name: Construire l'application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Clé qui signe les mises à jour automatiques (Settings › Secrets and variables › Actions).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Sans la clé, l'installeur est quand même fabriqué, mais sans fichiers de mise à jour.
          args: ${{ env.HAS_UPDATER_KEY == 'true' && '--config src-tauri/tauri.updater.conf.json' || '' }}
          # Sur la branche principale, une page de téléchargement (Release) « v<version> » est
          # créée ou mise à jour automatiquement, avec l'installeur dedans.
          tagName: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && 'v__VERSION__' || '' }}
          releaseName: "Les broderies de Mamie v__VERSION__"
          releaseBody: "Téléchargez le fichier se terminant par « setup.exe » et double-cliquez dessus pour installer."
          releaseDraft: false
      - name: Mettre l'installeur à disposition
        uses: actions/upload-artifact@v4
        with:
          name: Installeur-Broderies-de-Mamie
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error
      - name: Vérifier les mises à jour automatiques
        if: env.HAS_UPDATER_KEY != 'true'
        run: echo "::warning::Secret TAURI_SIGNING_PRIVATE_KEY absent — pas de mise à jour automatique pour cette version."

