[package]
name = "broderie-core"
version = "1.0.0"
edition = "2021"
description = "Lecture des fichiers de broderie (PES, PEC, VP3), aperçus et bibliothèque sans doublons"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tiny-skia = "0.11"
jpeg-encoder = "0.6"
zip = { version = "2", default-features = false, features = ["deflate"] }
thiserror = "2"
walkdir = "2"
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"
